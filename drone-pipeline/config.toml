# =====================================================================
#  dronepipe settings
#  This is a TOML file: "name = value" lines, grouped under [headings].
#  Lines starting with # are comments - edit freely, they're ignored.
# =====================================================================

[paths]
# Where all your projects live. Each run creates:
#   <projects_root>/<site-name>/<YYYY-MM-DD>/raw/       (copies of your photos)
#   <projects_root>/<site-name>/<YYYY-MM-DD>/outputs/   (WebODM results)
#   <projects_root>/<site-name>/<YYYY-MM-DD>/share/     (Sketchfab zip)
# "~" means your home folder (/Users/<you> on a Mac).
projects_root = "~/Drone/Projects"


[webodm]
# The address of your local WebODM. Both the Docker install and the
# native Mac installer normally use port 8000.
url = "http://localhost:8000"

# Your WebODM login name (the account you created the first time you opened WebODM).
username = "admin"

# Your password is deliberately NOT stored here (config files get shared,
# committed to GitHub, backed up...). Instead the pipeline will:
#   1. use the WEBODM_PASSWORD environment variable if you've set it, or
#   2. ask you to type it when it runs (it won't show on screen).

# How often (seconds) to ask WebODM for progress while processing.
poll_seconds = 10


[images]
# DJI can shoot JPEG + DNG of the same frame. Both get COPIED into raw/,
# but only JPEGs are sent to WebODM by default, because:
#   - uploading both would give WebODM every photo twice, and
#   - I'm not certain ODM handles DJI DNG files reliably. (Flagged - test before relying on it.)
send_dng_to_webodm = false

# Gimbal pitch thresholds (degrees). DJI reports -90 for straight down.
# Pitch at or below nadir_max_pitch counts as "nadir" (looking down);
# pitch between that and oblique_max_pitch counts as "oblique";
# anything flatter is "near-horizontal" (usually not useful for mapping).
nadir_max_pitch = -80
oblique_max_pitch = -10


[overlap]
# The pre-flight report warns if estimated overlap is below these (percent).
# Typical mapping advice: 75-80% front overlap, 65-70% side overlap.
# Snow and other low-texture surfaces need MORE overlap, not less.
min_front_overlap = 70
min_side_overlap = 60


[crs]
# Every GeoTIFF is delivered in this coordinate reference system so that
# flights from different dates line up exactly in QGIS.
#
# EPSG:32610 = WGS 84 / UTM zone 10 North.
# Why this one:
#   - UTM zone 10 covers 126°W to 120°W - all of southwest BC
#     (Vancouver, the North Shore, Sea to Sky, Whistler, Pemberton, Manning).
#   - UTM is in METRES, so areas, distances, and elevation differences
#     are straightforward to measure in QGIS.
#   - "WGS 84" is the datum your drone's GPS uses, and it's what WebODM
#     produces by default for this area - so usually no reprojection happens.
# Alternative: EPSG:3157 (NAD83(CSRS) / UTM 10N), Canada's official datum.
#   Switch to it only if you start using survey ground control points
#   or BC government data that are in NAD83(CSRS). The two datums differ
#   by roughly 1-2 m, which is smaller than plain drone GPS error anyway.
# Sites east of 120°W (e.g. Rogers Pass) fall in zone 11 (EPSG:32611).
# For a site you revisit, keep ONE choice forever - consistency is the point.
target_epsg = 32610


[sketchfab]
# Shift the model so its centre sits at 0,0,0. Georeferenced models have
# huge coordinates (hundreds of thousands of metres) which make Sketchfab
# viewers jittery and hard to navigate. Recentring fixes that.
recenter_model = true
# WebODM models are "Z-up" (Z = height). Sketchfab expects "Y-up".
# Rotating means the model appears the right way up straight away.
convert_z_up_to_y_up = true
# Warn if the zip is bigger than this (MB). Check your Sketchfab plan's
# upload limit - it varies by plan and I haven't verified current numbers.
warn_size_mb = 100


# =====================================================================
#  PROCESSING PRESETS
#  Each [presets.<name>] block is a recipe of WebODM/ODM options.
#  Option names are exactly the ones in WebODM's "Edit options" panel.
#  The pipeline checks these names against your WebODM before starting,
#  and warns you about any it doesn't recognise.
#  Make your own by copying a block and changing the name.
# =====================================================================

[presets.fast-preview]
description = "Quick, low-detail check that the flight worked. Minutes, not hours."
[presets.fast-preview.options]
pc-quality = "low"            # point cloud density: ultra/high/medium/low/lowest
feature-quality = "low"       # how hard it looks for matching points between photos
dsm = true                    # make a Digital Surface Model (top of everything)
orthophoto-resolution = 10    # cm per pixel
dem-resolution = 20           # cm per pixel for DSM/DTM
auto-boundary = true          # trim messy edges automatically

[presets.terrain-high-quality]
description = "Detailed DSM + DTM for terrain and avalanche mapping. Slow."
[presets.terrain-high-quality.options]
pc-quality = "high"
feature-quality = "high"
min-num-features = 15000      # find more tie points - helps on low-texture snow
dsm = true
dtm = true                    # Digital Terrain Model (tries to remove trees/buildings)
dem-resolution = 5            # cm per pixel
orthophoto-resolution = 3     # cm per pixel
auto-boundary = true

[presets.oblique-3d-model]
description = "Nadir + oblique flights combined into a detailed 3D model for Sketchfab."
[presets.oblique-3d-model.options]
pc-quality = "high"
feature-quality = "high"
mesh-octree-depth = 12        # more detail in the 3D mesh
mesh-size = 300000            # max number of triangles in the mesh
dsm = true
auto-boundary = true
